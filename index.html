<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ayuda de DIV 2</title>
  <link rel="icon" href="icono.ico">
  <link rel="stylesheet" href="htaw.css">
  <link rel="stylesheet" href="app.css">
  <style>
    .web-links { flex: none; margin: 0 8px 8px; font-size: 12px; border: 1px solid var(--htaw-border);
      border-radius: var(--htaw-radius); background: var(--htaw-surface); }
    .web-links summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      color: var(--htaw-fg-muted); cursor: default; user-select: none; }
    .web-links summary::-webkit-details-marker { display: none; }
    .web-links summary::after { content: "\25B4"; margin-left: auto; transition: rotate .15s; }
    .web-links[open] summary::after { rotate: 180deg; }
    .web-links summary:hover { color: var(--htaw-fg); }
    .web-links .body { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 6px; }
    .web-links a { color: var(--htaw-link); text-decoration: none; } .web-links a:hover { text-decoration: underline; }
    .web-links .muted { font-size: 11px; line-height: 1.3; }
    button[data-act=save] { display: none; }
  </style>
  <script src="ayuda.js"></script>
</head>
<body>
  <div id="app">
    <aside id="side">
      <div class="side-head">
        <div class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4 4"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false">
        </div>
        <div class="tabs" role="tablist">
          <button class="tab selected" data-tab="toc" data-i18n="tabToc"></button>
          <button class="tab" data-tab="idx" data-i18n="tabIdx"></button>
          <button class="tab" data-tab="rec" data-i18n="tabRec"></button>
        </div>
      </div>
      <div id="list" class="side-body" tabindex="-1"></div>
      <details class="web-links" id="webLinks" open>
        <summary>&#11015; Versión de escritorio (htaW)</summary>
        <div class="body">
          <a href="AyudaDIV2.htaw" download>Descargar AyudaDIV2.htaw</a>
          <a href="https://github.com/XWolfOverride/WolfGlue-htaW/releases/latest" target="_blank" rel="noopener">Descargar htaW para Windows &#8599;</a>
          <span class="muted">El .htaw se abre con <a href="https://github.com/XWolfOverride/WolfGlue-htaW" target="_blank" rel="noopener">htaW</a> (release o autobuild).</span>
        </div>
      </details>
      <script>(() => { const d = document.getElementById("webLinks");
        try { if (localStorage.getItem("webLinks") === "0") d.open = false; } catch { }
        d.addEventListener("toggle", () => { try { localStorage.setItem("webLinks", d.open ? "1" : "0"); } catch { } }); })();</script>
    </aside>
    <div id="split" role="separator" tabindex="0" aria-orientation="vertical"></div>
    <section id="view">
      <div class="toolbar">
        <button id="back" class="icon" data-i18n-title="back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
        <button id="fwd" class="icon" data-i18n-title="fwd"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
        <button id="home" class="icon" data-i18n-title="home"><svg viewBox="0 0 16 16"><path d="M2.5 7.5L8 3l5.5 4.5M4 6.5V13h3v-3.5h2V13h3V6.5"/></svg></button>
        <span id="crumb" class="muted"></span>
        <span class="spacer"></span>
        <button id="zoomOut" class="icon" data-i18n-title="zoomOut"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg></button>
        <span id="zoomVal" class="muted"></span>
        <button id="zoomIn" class="icon" data-i18n-title="zoomIn"><svg viewBox="0 0 16 16"><path d="M4 8h8M8 4v8"/></svg></button>
      </div>
      <main id="scroll"><article id="art"></article></main>
    </section>
  </div>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
